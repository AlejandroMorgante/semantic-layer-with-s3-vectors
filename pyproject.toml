[project]
name = "s3-vectors-semantic-layer"
version = "0.1.0"
description = "Reproducible benchmark for Markdown, S3 Vectors, Neptune GraphRAG, and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Alejandro Morgante" }]
dependencies = [
  "boto3>=1.40.0,<2",
]

[project.scripts]
semantic-layer-benchmark = "semantic_layer_benchmark.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_layer_benchmark"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
